name: mconnect
description: "Multi-platform music aggregator"
publish_to: 'none'
version: 1.5.0+16

environment:
  # 3.13.0 与 Flutter 3.47.5 自带的 Dart 3.13.4 对齐。
  # 原先的 ^3.10.3 会把包的语言版本钉在 3.10，使 dot-shorthands
  # (Dart 3.11+ 默认启用) 不可用 —— Flutter 3.47.5 的 SDK 源码
  # (如 animation_controller.dart / text_painter.dart) 使用了该语法，
  # 导致 `flutter test` 编译失败。
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # SDK-provided (not a third-party package): required for real localisation.
  # Without it the generated AppLocalizations cannot even be imported, and the
  # Material/Cupertino built-in strings (dialog buttons, date pickers, ...)
  # stay English no matter what the ARB files say.
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^2.0.0

  # State Management
  flutter_riverpod: ^2.6.0

  # Navigation
  go_router: ^14.0.0

  # Networking
  dio: ^5.7.0
  crypto: ^3.0.0

  # Audio Playback
  just_audio: ^0.10.6
  audio_service: ^0.18.17
  audio_session: ^0.2.4
  just_audio_windows: ^0.2.3
  media_kit: ^1.2.6
  media_kit_libs_windows_audio: ^1.0.9

  # Local Storage
  drift: ^2.22.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.0
  path: ^1.9.0
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^11.2.0

  # UI
  cached_network_image: ^4.0.4
  shimmer: ^4.0.0
  flutter_svg: ^2.0.10+1
  # 液态玻璃（iOS 26）底栏与控件。1.0.0 起有破坏性重命名，
  # 底栏必须用 GlassTabBar.bottom（GlassBottomBar 已删除）。
  liquid_glass_widgets: ^1.7.2

  # QR Code
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0

  # Crypto
  pointycastle: ^3.9.1
  encrypt: ^5.0.3

  # Utils
  intl: 0.20.3
  # GBK / GB18030 decode for user-supplied .lrc files (a Chinese .lrc is very
  # often GBK, and UTF-8-only decoding shows mojibake). Declared explicitly
  # because a package that is only reachable transitively may not be imported
  # (`depend_on_referenced_packages`); it was already in pubspec.lock as a
  # transitive dependency of audio_metadata_reader, so this adds no new code.
  charset: ^2.0.1
  collection: ^1.19.0
  json_annotation: ^4.9.0
  permission_handler: ^13.0.2
  uuid: ^4.0.0
  file_picker: 13.1.0
  flutter_native_splash: ^2.4.0
  connectivity_plus: ^7.3.2
  share_plus: ^13.3.1
  app_links: ^7.2.2
  # Desktop home-screen widget (RemoteViews). Its `platforms` map declares only
  # android and ios: on Windows it does NOT fail to compile, but any call throws
  # MissingPluginException - so every use goes through the facade in
  # lib/features/widget, which is a no-op off Android.
  home_widget: ^0.10.0
  # Opening the Last.fm / ListenBrainz authorisation page in a browser. Android
  # 11+ requires a `<queries>` entry for the VIEW intent (see
  # AndroidManifest.xml) or the lookup silently resolves to nothing; the
  # w2w3 specs doc records that diff. Windows 10+ needs nothing.
  url_launcher: ^6.3.1
  audio_metadata_reader: ^1.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  drift_dev: ^2.22.0
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#101522"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter_native_splash:
  color: "#101522"
  color_dark: "#101522"
  image: assets/images/splash_logo.png
  image_dark: assets/images/splash_logo.png
  android_12:
    color: "#101522"
    color_dark: "#101522"
    image: assets/images/splash_logo.png
    image_dark: assets/images/splash_logo.png

flutter:
  uses-material-design: true

  # Required by `flutter gen-l10n`: without it the tool refuses to emit
  # AppLocalizations ("Attempted to generate localizations code without having
  # the flutter: generate flag turned on"). The generated files are committed,
  # so builds and CI need no extra generation step.
  generate: true
